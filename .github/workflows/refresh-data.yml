name: Refresh Live Data

on:
  schedule:
    # Runs every 6 hours (UTC). Adjust as needed — more frequent runs consume
    # more of the free-tier Copernicus/OpenAQ quota faster.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # allows manually triggering a refresh from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live data refresh
        env:
          SENTINELHUB_CLIENT_ID: ${{ secrets.SENTINELHUB_CLIENT_ID }}
          SENTINELHUB_CLIENT_SECRET: ${{ secrets.SENTINELHUB_CLIENT_SECRET }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python -m src.pipeline.refresh_live_data

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_satellite_sample.json data/air_quality.db
          git diff --cached --quiet || git commit -m "Automated data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
