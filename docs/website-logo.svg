<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Clean Air &amp; Climate Resilience</title>
  <desc id="desc">A modern teal and dark navy environmental monitoring logo combining a leaf, airflow, globe and satellite signal.</desc>

  <defs>
    <clipPath id="orbClip">
      <circle cx="180" cy="180" r="132"/>
    </clipPath>
  </defs>

  <!-- Icon -->
  <g transform="translate(48 48)">
    <circle cx="132" cy="132" r="126" fill="none" stroke="#0B1220" stroke-width="12"/>
    <circle cx="132" cy="132" r="108" fill="#F7FFFE"/>

    <!-- Leaf -->
    <path d="M116 226
             C62 208 47 158 67 111
             C83 74 118 49 161 38
             C151 77 157 105 181 128
             C204 151 204 188 177 211
             C159 226 138 232 116 226Z"
          fill="#4FD1C5"/>
    <path d="M86 190 C104 158 126 128 155 98"
          fill="none" stroke="#0B1220" stroke-width="9"
          stroke-linecap="round"/>

    <!-- Airflow -->
    <path d="M79 207 C111 181 143 179 173 194 C195 205 215 200 222 183"
          fill="none" stroke="#0B1220" stroke-width="9"
          stroke-linecap="round"/>
    <path d="M94 226 C125 209 153 211 178 223 C196 232 213 228 224 215"
          fill="none" stroke="#4FD1C5" stroke-width="8"
          stroke-linecap="round"/>

    <!-- Satellite -->
    <g transform="translate(150 43) rotate(24 0 0)">
      <rect x="-7" y="0" width="38" height="50" rx="7" fill="#0B1220"/>
      <rect x="-42" y="8" width="25" height="34" rx="3" fill="#0B1220"/>
      <rect x="38" y="8" width="25" height="34" rx="3" fill="#0B1220"/>
      <path d="M-42 19H-17M-42 31H-17M38 19H63M38 31H63"
            stroke="#4FD1C5" stroke-width="3"/>
      <path d="M12 50V65" stroke="#0B1220" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="12" cy="70" rx="20" ry="8" fill="#0B1220"/>
    </g>

    <!-- Signal waves -->
    <path d="M207 94 C221 103 228 117 228 132"
          fill="none" stroke="#4FD1C5" stroke-width="7" stroke-linecap="round"/>
    <path d="M218 82 C239 96 250 115 250 136"
          fill="none" stroke="#4FD1C5" stroke-width="7" stroke-linecap="round"/>

    <!-- Small orbit accent -->
    <path d="M41 128 A92 92 0 0 1 92 48"
          fill="none" stroke="#4FD1C5" stroke-width="7" stroke-linecap="round"/>
    <circle cx="38" cy="137" r="7" fill="#4FD1C5"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(365 92)">
    <text x="0" y="82"
          font-family="Inter, Arial, Helvetica, sans-serif"
          font-size="72" font-weight="800"
          letter-spacing="1">
      <tspan fill="#0B1220">CLEAN</tspan>
      <tspan fill="#4FD1C5"> AIR</tspan>
    </text>

    <text x="3" y="132"
          font-family="Inter, Arial, Helvetica, sans-serif"
          font-size="28" font-weight="600"
          letter-spacing="6"
          fill="#0B1220">&amp; CLIMATE RESILIENCE</text>

    <rect x="4" y="160" width="620" height="6" rx="3" fill="#0B1220"/>
    <rect x="405" y="160" width="219" height="6" rx="3" fill="#4FD1C5"/>

    <circle cx="646" cy="163" r="6" fill="#4FD1C5"/>
    <circle cx="666" cy="163" r="6" fill="#0B1220"/>
  </g>
</svg>